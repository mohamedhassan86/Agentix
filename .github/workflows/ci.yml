name: CI

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agentix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/prisma
            ~/.config/prisma
            node_modules/.prisma
            src/generated/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma', 'package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Generate Prisma client (with retry)
        run: |
          for i in 1 2 3; do
            npx prisma generate && break
            echo "prisma generate failed attempt $i, retrying..."
            sleep 5
          done
          npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test

      - name: Validate Prisma schema (with retry)
        run: |
          for i in 1 2 3; do
            npm run prisma:validate && break
            echo "prisma validate failed attempt $i, retrying..."
            sleep 5
          done
          npm run prisma:validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test

      - name: Run migrations (with retry)
        run: |
          for i in 1 2 3; do
            npm run db:migrate && break
            echo "db:migrate failed attempt $i, retrying..."
            sleep 5
          done
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test

      - name: Check migration status
        run: npm run db:status
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test

      - name: Lint
        run: npm run lint

      - name: Test policy
        run: npm run test:policy

      - name: Architecture check
        run: npm run architecture:check

      - name: OpenAPI generate and check
        run: |
          npm run openapi:generate
          npm run openapi:check
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test
          APP_ORIGIN: http://localhost:3000
          FOUNDATION_DEMO_ENABLED: true

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test
          APP_ORIGIN: http://localhost:3000
          FOUNDATION_DEMO_ENABLED: true

      - name: License check
        run: npm run license:check

      - name: Full verification sequence (same as local)
        run: npm run lint && npm test && npm run build && npm run license:check && npm run architecture:check && npm run openapi:check && npm run test:policy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agentix_test
          APP_ORIGIN: http://localhost:3000
          FOUNDATION_DEMO_ENABLED: true
